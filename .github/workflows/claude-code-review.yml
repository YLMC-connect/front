name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # 초안 PR 과 fork PR(시크릿 접근 불가)은 건너뛴다.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    env:
      HAS_CLAUDE_AUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - name: Skip when no Claude credential is configured
        if: env.HAS_CLAUDE_AUTH != 'true'
        run: echo "::notice::CLAUDE_CODE_OAUTH_TOKEN 또는 ANTHROPIC_API_KEY 시크릿이 없어 리뷰를 건너뜁니다."

      - uses: actions/checkout@v4
        if: env.HAS_CLAUDE_AUTH == 'true'
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        if: env.HAS_CLAUDE_AUTH == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            이 PR 을 코드 리뷰한다. 저장소 규칙은 AGENTS.md(CLAUDE.md 가 불러옴)를 따른다.
            관련 도메인의 docs/features/<도메인>.md 에서 결정 사항·데이터 타입을 확인하고 어긋나는지 본다.

            중점:
            - 정확성 버그(런타임 오류, 잘못된 조건, 누락된 에러·로딩 처리, API 계약 불일치)
            - 보안(토큰·개인정보 노출, 안전하지 않은 저장)
            - React Native / Expo / TanStack Query 사용상의 문제와 성능
            - 기존 코드와의 중복, 테스트 누락

            확실한 문제만 지적하고, 사소한 취향 차이는 적지 않는다.
            구체적인 줄에 대한 지적은 mcp__github_inline_comment__create_inline_comment 로 인라인 댓글을 남기고,
            전체 요약은 `gh pr comment` 로 한국어 댓글 하나만 남긴다. 문제가 없으면 짧게 그렇다고만 쓴다.
          claude_args: >-
            --model claude-opus-5-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
