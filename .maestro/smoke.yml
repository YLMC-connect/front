appId: com.ylmc.connect.dev
name: YLMC Connect v1 smoke
tags:
  - smoke
---
- openLink: ${EXPO_DEV_CLIENT_URL}
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
- runFlow:
    when:
      visible: "Reload"
    commands:
      - tapOn: "Reload"
- extendedWaitUntil:
    visible:
      id: screen-home
    timeout: 60000
- assertVisible:
    id: screen-home
- tapOn:
    id: tab-market
- assertVisible:
    id: screen-market
- tapOn:
    id: tab-group
- assertVisible:
    id: screen-group
- tapOn:
    id: tab-life-study
- assertVisible:
    id: screen-life-study
- tapOn:
    id: tab-prayer
- assertVisible:
    id: screen-prayer
- tapOn:
    id: tab-mypage
- assertVisible:
    id: screen-mypage
