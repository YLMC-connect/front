appId: com.ylmc.connect.dev
name: YLMC Connect v1 smoke
tags:
  - smoke
---
- extendedWaitUntil:
    visible: Continue
    timeout: 60000
- tapOn: Continue
- extendedWaitUntil:
    visible: Reload
    timeout: 60000
- tapOn:
    point: "90%,45%"
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: tab-home
    timeout: 60000
- tapOn:
    id: tab-home
- extendedWaitUntil:
    visible:
      id: screen-home
    timeout: 60000
- assertVisible:
    id: screen-home
- tapOn:
    id: tab-market
- assertVisible:
    id: screen-market
- tapOn:
    id: tab-group
- assertVisible:
    id: screen-group
- tapOn:
    id: tab-life-study
- assertVisible:
    id: screen-life-study
- tapOn:
    id: tab-prayer
- assertVisible:
    id: screen-prayer
- tapOn:
    id: tab-mypage
- assertVisible:
    id: screen-mypage
