name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # main 보호 규칙의 필수 체크다. Claude 가 BLOCK 판정을 내리면 실패해 병합을 막는다.
  review:
    # 초안 PR 과 fork PR(시크릿 접근 불가)은 건너뛴다. 건너뛴 체크는 필수 체크를 통과한 것으로 본다.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    env:
      HAS_CLAUDE_AUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '' }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Skip when no Claude credential is configured
        if: env.HAS_CLAUDE_AUTH != 'true'
        run: echo "::notice::CLAUDE_CODE_OAUTH_TOKEN 또는 ANTHROPIC_API_KEY 시크릿이 없어 리뷰를 건너뜁니다."

      - uses: actions/checkout@v4
        if: env.HAS_CLAUDE_AUTH == 'true'
        with:
          fetch-depth: 1

      - id: claude
        uses: anthropics/claude-code-action@v1
        if: env.HAS_CLAUDE_AUTH == 'true'
        # 한도 초과·인증 오류 등으로 리뷰 자체가 실패하면 병합을 막지 않는다(아래 판정 단계에서 처리).
        continue-on-error: true
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            HEAD SHA: ${{ github.event.pull_request.head.sha }}

            이 PR 을 코드 리뷰한다. 저장소 규칙은 AGENTS.md(CLAUDE.md 가 불러옴)를 따른다.
            관련 도메인의 docs/features/<도메인>.md 에서 결정 사항·데이터 타입을 확인하고 어긋나는지 본다.

            중점:
            - 정확성 버그(런타임 오류, 잘못된 조건, 누락된 에러·로딩 처리, API 계약 불일치)
            - 보안(토큰·개인정보 노출, 안전하지 않은 저장)
            - React Native / Expo / TanStack Query 사용상의 문제와 성능
            - 기존 코드와의 중복, 테스트 누락
            - 디자인 시스템 준수 (아래)

            디자인 시스템 — 기준은 docs/adr/0007-design-system-v2.md, docs/features/common.md:
            - 공통 컴포넌트는 모두 src/components/ui 에 있다(index.tsx 에서 export).
              화면·도메인 컴포넌트가 같은 역할의 UI 를 React Native 기본 요소로 새로 만들면 지적하고 대신 쓸 컴포넌트를 알려준다.
              예: Text → AppText, 직접 만든 버튼(Pressable/TouchableOpacity) → Button·MotionPressable,
              TextInput → TextField·Textarea, Modal → BottomSheet·ConfirmDialog·RadioSheet,
              ActivityIndicator → Spinner, 카드 → Card, 배지 → Badge, 칩 → Chip·FilterChips,
              빈 화면·오류 → Empty·ErrorState, 체크박스·라디오 → Checkbox·Radio, 아이콘 → AppIcon, 하단 고정 버튼 → FloatingBottomBar.
            - 색·글자 크기·간격·모서리·그림자를 직접 값(#hex, rgba, 숫자 fontSize 등)으로 쓰지 않고
              src/constants/theme.ts 의 토큰을 쓰는지 본다.
            - 디자인 시스템에 없는 새 공통 UI 를 화면 안에 만들면 지적한다(디자인 시스템에 먼저 추가하는 것이 규칙).
            - src/components/ui 안의 컴포넌트 자체를 구현·수정하는 코드는 이 항목에서 제외한다.
            - 디자인 시스템 지적은 의견이다. 이것만으로 BLOCK 하지 않는다.

            확실한 문제만 지적하고, 사소한 취향 차이는 적지 않는다.
            구체적인 줄에 대한 지적은 mcp__github_inline_comment__create_inline_comment 로 인라인 댓글을 남기고,
            전체 요약은 `gh pr comment` 로 한국어 댓글 하나만 남긴다. 문제가 없으면 짧게 그렇다고만 쓴다.

            판정 — 이 판정이 병합 여부를 결정한다:
            - BLOCK: 병합하면 확실히 문제가 되는 경우에만. 앱 크래시·런타임 오류, 데이터 손실,
              토큰·개인정보 노출 같은 보안 문제, API 계약과 어긋나 기능이 동작하지 않는 경우.
            - PASS: 그 외 모두. 개선 제안·스타일·테스트 보강 의견만 있으면 PASS 다.
            확신이 없으면 PASS 로 하고 의견만 남긴다.
            요약 댓글의 맨 마지막 줄에 아래 둘 중 하나를 글자 그대로 넣는다(HTML 주석이라 화면에는 안 보인다).
            <!-- claude-verdict: PASS sha=${{ github.event.pull_request.head.sha }} -->
            <!-- claude-verdict: BLOCK sha=${{ github.event.pull_request.head.sha }} -->
            BLOCK 이면 요약 댓글 첫 줄에 "🚫 병합 차단:" 과 함께 이유를 한 줄로 적는다.
          claude_args: >-
            --model claude-opus-5-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

      - name: Check Claude verdict
        if: env.HAS_CLAUDE_AUTH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_OUTCOME: ${{ steps.claude.outcome }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          if [ "$REVIEW_OUTCOME" != "success" ]; then
            # 공개 저장소라 전체 실행 로그 대신 마지막 결과 메시지만 남긴다.
            # 셸이 pipefail 로 돌므로, 원인 추출이 실패해도 체크가 깨지지 않게 `|| true` 로 넘긴다.
            reason=""
            if [ -n "$EXECUTION_FILE" ] && [ -f "$EXECUTION_FILE" ]; then
              reason=$(jq -r 'if type == "array" then (map(select(.type == "result")) | last | .result // empty) else (.result // empty) end' "$EXECUTION_FILE" 2>/dev/null | head -c 500 | tr '\n' ' ' || true)
            fi
            echo "::warning::Claude 리뷰 실행이 실패했습니다(한도·인증 오류 등). 병합을 막지 않습니다. 원인: ${reason:-알 수 없음}"
            exit 0
          fi
          # 이 워크플로(github-actions[bot])가 남긴 댓글 중 현재 커밋에 대한 판정만 본다.
          verdict=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]") | .body' \
            | grep -oE "claude-verdict: (PASS|BLOCK) sha=$HEAD_SHA" | tail -n 1 | awk '{print $2}')
          case "$verdict" in
            PASS)
              echo "Claude 리뷰 통과" ;;
            BLOCK)
              echo "::error::Claude 리뷰가 병합을 차단했습니다. PR 의 리뷰 댓글을 확인하고 수정 후 다시 푸시하세요."
              exit 1 ;;
            *)
              echo "::warning::Claude 판정을 찾지 못했습니다. 병합을 막지 않습니다." ;;
          esac
