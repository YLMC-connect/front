appId: com.ylmc.connect.dev
name: YLMC Connect v1 smoke
tags:
  - smoke
---
- runFlow:
    when:
      visible: Process system isn't responding
    commands:
      - tapOn: Wait
- runFlow:
    when:
      visible: Continue
    commands:
      - tapOn: Continue
      - extendedWaitUntil:
          visible: Reload
          timeout: 60000
      - tapOn:
          point: "90%,45%"
- runFlow:
    when:
      visible: Reload
    commands:
      - tapOn:
          point: "90%,45%"
- runFlow:
    when:
      visible: DEVELOPMENT SERVERS
    commands:
      - tapOn:
          point: "50%,24%"
      - extendedWaitUntil:
          visible: Reload
          timeout: 60000
      - tapOn:
          point: "90%,45%"
- openLink: ylmc-connect:///
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    when:
      visible: Process system isn't responding
    commands:
      - tapOn: Wait
- runFlow:
    when:
      visible: Continue
    commands:
      - tapOn: Continue
      - extendedWaitUntil:
          visible: Reload
          timeout: 60000
      - tapOn:
          point: "90%,45%"
- runFlow:
    when:
      visible: Reload
    commands:
      - tapOn:
          point: "90%,45%"
- extendedWaitUntil:
    visible:
      id: tab-home
    timeout: 60000
- tapOn:
    id: tab-home
- extendedWaitUntil:
    visible:
      id: screen-home
    timeout: 60000
- assertVisible:
    id: screen-home
- tapOn:
    id: tab-market
- assertVisible:
    id: screen-market
- tapOn: 아이 장난감 정리하면서 나눔합니다 (블록·인형 30점)
- extendedWaitUntil:
    visible:
      id: market-comment-input
    timeout: 5000
- tapOn:
    id: market-comment-input
- inputText: Maestro comment
- hideKeyboard
- tapOn:
    id: market-comment-submit
- scrollUntilVisible:
    element:
      text: Maestro comment
    direction: DOWN
- extendedWaitUntil:
    visible: Maestro comment
    timeout: 5000
- back
- assertVisible:
    id: screen-home
- tapOn:
    id: tab-group
- assertVisible:
    id: screen-group
- tapOn:
    id: tab-prayer
- assertVisible:
    id: screen-faith
- tapOn:
    id: tab-life-study
- assertVisible:
    id: screen-faith
- extendedWaitUntil:
    visible: 지금 신청 가능한 과정
    timeout: 5000
