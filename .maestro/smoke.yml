appId: com.ylmc.connect.dev
name: YLMC Connect v1 smoke
tags:
  - smoke
---
- runFlow:
    when:
      visible: Process system isn't responding
    commands:
      - tapOn: Wait
- runFlow:
    when:
      visible: Continue
    commands:
      - tapOn: Continue
      - extendedWaitUntil:
          visible: Reload
          timeout: 60000
      - tapOn:
          point: "90%,45%"
- runFlow:
    when:
      visible: Reload
    commands:
      - tapOn:
          point: "90%,45%"
- runFlow:
    when:
      visible: DEVELOPMENT SERVERS
    commands:
      - tapOn:
          point: "50%,24%"
      - extendedWaitUntil:
          visible: Reload
          timeout: 60000
      - tapOn:
          point: "90%,45%"
- openLink: ylmc-connect:///
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    when:
      visible: Process system isn't responding
    commands:
      - tapOn: Wait
- runFlow:
    when:
      visible: Continue
    commands:
      - tapOn: Continue
      - extendedWaitUntil:
          visible: Reload
          timeout: 60000
      - tapOn:
          point: "90%,45%"
- runFlow:
