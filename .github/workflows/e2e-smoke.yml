name: E2E Smoke

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  maestro-smoke:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci
      - run: brew tap mobile-dev-inc/tap
      - run: brew install mobile-dev-inc/tap/maestro
      - run: npm run test:e2e:smoke
