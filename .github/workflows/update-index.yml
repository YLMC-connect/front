name: Auto-update INDEX

on:
  push:
    branches: [main]
    paths:
      - "docs/features/**"
      - "scripts/gen-index.sh"
      - ".github/workflows/update-index.yml"
  issues:
    types: [opened, closed, edited, reopened, labeled, unlabeled, deleted]
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: update-index
  cancel-in-progress: false

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate INDEX 도메인 상태표
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/gen-index.sh

      - name: Commit if changed
        run: |
          if git diff --quiet docs/INDEX.md; then
            echo "변경 없음."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/INDEX.md
          git commit -m "chore: auto-update INDEX 도메인 상태표"
          git push
